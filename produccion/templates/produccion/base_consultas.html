<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Resultados · Sistema EPP{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b46;font:15px system-ui,sans-serif}a{color:#1755b5}nav{background:#142a46;color:white;padding:20px max(24px,calc((100% - 1320px)/2));display:flex;gap:28px;align-items:center}nav a{color:#dbe7fa;text-decoration:none}nav strong{margin-right:auto}main{max-width:1370px;margin:auto;padding:32px 24px}h1{font-size:30px;margin:6px 0 12px}h2{font-size:19px;margin-top:0}.eyebrow{color:#527097;font-weight:700;letter-spacing:.12em;font-size:12px}.muted{color:#5d6f85}.cabecera{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:26px}.boton{display:inline-block;background:#1b58b8;color:white;border-radius:8px;padding:12px 17px;text-decoration:none;font-weight:600}.tarjetas{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.tarjeta,.panel{background:white;border:1px solid #e0e7f0;border-radius:12px;padding:22px;box-shadow:0 3px 12px #172b4605}.valor{display:block;font-size:32px;font-weight:750;margin:10px 0}.verde-texto{color:#15754e}.rojo-texto{color:#ba3542}.ambar-texto{color:#956100}.graficos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.fila-grafico{margin:17px 0}.etiqueta{display:flex;justify-content:space-between;gap:20px;font-size:14px;margin-bottom:7px}.pista{height:12px;border-radius:5px;background:#edf1f7;overflow:hidden}.barra{height:100%;background:#3267c8}.verde{background:#23936a}.rojo{background:#d35865}.ambar{background:#e5ac38}.gris{background:#8795a9}.tabla{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;background:#f5f7fb;color:#5b6d83;font-size:12px;padding:14px;white-space:nowrap}td{padding:15px 14px;border-bottom:1px solid #ecf0f5}td small{display:block;color:#687a91;margin-top:5px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#e8f0ff;color:#285baa;font-size:12px}.aviso{padding:14px 18px;border-left:3px solid #d8a139;background:#fff8e8;margin:18px 0}.paginacion{display:flex;gap:20px;justify-content:center;padding:22px}footer{margin-top:25px;color:#687a91;font-size:13px}.resumen-linea{display:flex;flex-wrap:wrap;gap:24px}.panel{margin-bottom:20px}@media(max-width:900px){.tarjetas{grid-template-columns:repeat(2,1fr)}.graficos{grid-template-columns:1fr}.cabecera{align-items:flex-start;flex-direction:column}nav{flex-wrap:wrap;gap:16px}}@media(max-width:480px){.tarjetas{grid-template-columns:1fr}}
</style></head><body>
<nav><strong>SISTEMA EPP <span style="font-weight:400">/ Producción y calidad</span></strong><a href="{% url 'panel_resultados' %}">Resultados</a><a href="{% url 'lista_analisis' %}">Análisis</a><a href="/admin/">Administración</a></nav>
<main>{% block contenido %}{% endblock %}<footer>CU-11 · Consulta de producción y calidad · Clasificaciones registradas por el supervisor</footer></main>
</body></html>
