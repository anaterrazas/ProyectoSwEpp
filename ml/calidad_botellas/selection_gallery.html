<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección humana · EPP</title><style>
body{margin:0;font:15px system-ui;color:#203448;background:#f1f5f8}header{background:white;padding:24px}main{padding:24px}.notice{background:#fff0c6;padding:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}article{padding:14px;border:1px solid #c4d1dc;background:white;border-radius:7px;overflow-wrap:anywhere}article img{width:100%;height:260px;object-fit:contain;background:#e3e8ed}article p{font-size:13px;line-height:1.4}select{padding:8px;margin:12px;font:inherit}a{color:#175f9e}details{font-size:12px}pre{white-space:pre-wrap}h1{margin-top:0}li{margin:5px 0}</style></head><body>
<header><h1>Selección para revisión humana</h1><p id="totals"></p><p class="notice">Solo lectura. Las etiquetas mostradas son las existentes. Good Cap no confirma conformidad global. La evaluabilidad y las propuestas siguen pendientes de revisión humana. No se ha entrenado.</p><a href="INFORME_SELECCION.md">Informe de selección</a> · <a href="summary.json">Estadísticas</a> · <a href="review_selection.jsonl">Lista JSONL</a><div><label>Fuente <select id="source"><option value="all">Todas</option></select></label><label>Objetivo de revisión <select id="reason"><option value="all">Todos</option></select></label></div><p id="count"></p></header><main id="gallery"></main><script type="application/json" id="data">SELECTION_DATA_HERE</script><script>
'use strict';const data=JSON.parse(document.getElementById('data').textContent),el=id=>document.getElementById(id);function node(t,s){const n=document.createElement(t);if(s!==undefined)n.textContent=s;return n;}

const utilityNames={NO_SMALL_REGION:'Sin regiones pequeñas',OUTSIDE_TARGET_TAXONOMY:'Sin equivalencia con defectos objetivo',TECHNICAL_REVIEW_REQUIRED:'Revisión técnica necesaria',OTHER_LARGER_TARGET_REGION_AVAILABLE:'Hay otra región objetivo de mayor tamaño',THIN_ELONGATED_TARGET_POTENTIALLY_USEFUL:'Región estrecha y alargada, potencialmente útil',ONLY_SMALL_TARGET_REGIONS_NEEDS_DETAIL:'Solo regiones pequeñas: hace falta detalle'};
const jointNames={FULL_OBJECT_FRAMING_CANDIDATE:'Encuadre completo candidato; confirmar detalle de cuerpo y tapa',CAP_FOCUSED_SOURCE_NEEDS_BODY_VIEW:'Vista centrada en tapa: falta confirmar el cuerpo completo',TECHNICAL_OR_FRAMING_REVIEW:'Revisar calidad y encuadre'};
function humanReason(value){const prefix='Regiones pequeñas: ';return value.startsWith(prefix)?prefix+(utilityNames[value.slice(prefix.length)]||value.slice(prefix.length)):value;}
function sourceName(value){return value==='mendeley_kthmmbsh8t_v1'?'Mendeley · botellas de champú':value==='roboflow_caps_v26'?'Roboflow · defectos de tapa':value;}
function conformityName(value){return value==='CAP_GOOD_SOURCE_CUE_ONLY'?'Tapa buena en origen; conformidad global pendiente':'Sin evidencia fuente para proponer conformidad';}

function card(r){const a=node('article'),link=node('a');link.href=r.original_url;link.target='_blank';link.rel='noopener';if(r.thumbnail){const im=node('img');im.src=r.thumbnail;im.alt=r.file_name;im.loading='lazy';link.append(im);}else link.textContent='Abrir original';a.append(link,node('h3',sourceName(r.source)),node('p',r.file_name),node('strong',humanReason(r.review_reason)),node('p',Object.entries(r.labels).map(([k,v])=>k+': '+(v===null?'desconocido':v===1?'positivo':'negativo')).join(' · ')),node('p','Clase fuente: '+r.classes.join(', ')),node('p','Grupo: '+r.group_id+' · propuesta: '+r.proposed_partition),node('p','Licencia: '+r.license+' · autores: '+r.creators.join(', ')));const license=node('a','Ver licencia');license.href=r.license_url;license.target='_blank';license.rel='noopener';a.append(license,node('p','Regiones pequeñas: '+utilityNames[r.tiny_utility.category]),node('p','Evaluabilidad conjunta: '+jointNames[r.review_cues.joint_evaluation]),node('p','Conformidad: '+conformityName(r.review_cues.conformity_candidate)+' · confirmación pendiente'));const questions=node('ul');for(const q of ['¿Hay una sola botella identificable y cuerpo, contorno y tapa visibles?','¿Se distinguen los detalles de superficie en el original?','¿La clase fuente corresponde a esta botella y a la etapa del proceso?','¿Se necesitan otras vistas para decidir? Mantener lo desconocido.'])questions.append(node('li',q));a.append(questions);const d=node('details');d.append(node('summary','Trazabilidad y motivos'),node('pre',JSON.stringify({sample_id:r.sample_id,sha256:r.expected_hash,source:r.source_url,scope:r.scope,small:r.tiny_utility,flags:r.flags},null,2)));a.append(d);return a;}
function render(){const rows=data.rows.filter(r=>(el('source').value==='all'||r.source===el('source').value)&&(el('reason').value==='all'||r.review_reason===el('reason').value));el('count').textContent=rows.length+' imágenes seleccionadas con estos filtros';el('gallery').replaceChildren();for(const reason of [...new Set(rows.map(r=>r.review_reason))]){const section=node('section');section.append(node('h2',humanReason(reason)));const grid=node('div');grid.className='cards';grid.append(...rows.filter(r=>r.review_reason===reason).map(card));section.append(grid);el('gallery').append(section);}}
for(const [id,key] of [['source','source'],['reason','review_reason']])for(const value of [...new Set(data.rows.map(r=>r[key]))]){const o=node('option',id==='reason'?humanReason(value):sourceName(value));o.value=value;el(id).append(o);}el('totals').textContent=data.rows.length+' imágenes · '+JSON.stringify(data.summary.selected_by_source)+' · cero confirmaciones automáticas';el('source').onchange=render;el('reason').onchange=render;render();
</script></body></html>
